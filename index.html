<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRUDGE DRIVE - Vehicular Combat</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://js.puter.com/v2/"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; font-family: 'Inter', sans-serif; }
    canvas#renderCanvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

    /* Loading Screen */
    #loadingScreen {
      position: fixed; inset: 0; z-index: 100;
      background: radial-gradient(circle at 50% 30%, #1a1420 0%, #0a0a0c 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s ease;
    }
    #loadingScreen.hidden { opacity: 0; pointer-events: none; }
    #loadingScreen h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 4rem; font-weight: 900; text-transform: uppercase;
      background: linear-gradient(135deg, #c9952a 0%, #f5d77a 40%, #c9952a 60%, #8b6914 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: none; filter: drop-shadow(0 0 30px rgba(201,149,42,0.4));
      letter-spacing: 0.15em;
    }
    #loadingScreen .subtitle {
      font-family: 'Inter', sans-serif; font-size: 0.9rem; color: #666;
      letter-spacing: 0.3em; text-transform: uppercase; margin-top: 8px;
    }
    #loadingScreen .bar-container {
      width: 300px; height: 4px; background: #1a1a1f; border-radius: 2px;
      margin-top: 40px; overflow: hidden;
    }
    #loadingScreen .bar-fill {
      height: 100%; width: 0%; border-radius: 2px;
      background: linear-gradient(90deg, #c9952a, #f5d77a);
      transition: width 0.3s ease;
    }
    #loadingScreen .load-text {
      color: #555; font-size: 0.75rem; margin-top: 12px; letter-spacing: 0.1em;
    }

    /* Main Menu Overlay */
    #mainMenu {
      position: fixed; inset: 0; z-index: 50;
      background: radial-gradient(ellipse at 50% 0%, rgba(30,20,40,0.95) 0%, rgba(10,10,12,0.98) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    #mainMenu.hidden { opacity: 0; pointer-events: none; }
    #mainMenu h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 5rem; font-weight: 900; text-transform: uppercase;
      background: linear-gradient(135deg, #c9952a 0%, #f5d77a 40%, #c9952a 60%, #8b6914 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 20px rgba(201,149,42,0.5));
      letter-spacing: 0.12em; margin-bottom: 4px;
    }
    #mainMenu .tagline {
      font-family: 'Inter', sans-serif; color: #8b6914; font-size: 0.85rem;
      letter-spacing: 0.4em; text-transform: uppercase; margin-bottom: 60px;
    }
    .menu-btn {
      font-family: 'Cinzel Decorative', serif; font-size: 1.1rem; font-weight: 700;
      padding: 16px 60px; margin: 8px 0; border: 1px solid #c9952a40;
      background: linear-gradient(135deg, rgba(201,149,42,0.15) 0%, rgba(201,149,42,0.05) 100%);
      color: #c9952a; cursor: pointer; letter-spacing: 0.15em; text-transform: uppercase;
      transition: all 0.3s ease; position: relative; overflow: hidden;
    }
    .menu-btn:hover {
      background: linear-gradient(135deg, rgba(201,149,42,0.3) 0%, rgba(201,149,42,0.1) 100%);
      border-color: #c9952a; box-shadow: 0 0 30px rgba(201,149,42,0.2);
      transform: scale(1.02);
    }
    .menu-btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(201,149,42,0.1), transparent);
      transition: left 0.5s ease;
    }
    .menu-btn:hover::before { left: 100%; }
    #mainMenu .credit {
      position: absolute; bottom: 20px; color: #333; font-size: 0.7rem; letter-spacing: 0.2em;
    }
    #mainMenu .credit span { color: #c9952a; }

    /* HUD */
    #hud {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: none; font-family: 'Inter', sans-serif;
    }
    #hud.active { display: block; }

    .hud-speed {
      position: absolute; bottom: 30px; right: 30px;
      text-align: center;
    }
    .hud-speed .value {
      font-family: 'Cinzel Decorative', serif; font-size: 3.5rem; font-weight: 900;
      color: #c9952a; line-height: 1;
      text-shadow: 0 0 20px rgba(201,149,42,0.4);
    }
    .hud-speed .unit { color: #666; font-size: 0.7rem; letter-spacing: 0.3em; }

    .hud-health {
      position: absolute; bottom: 30px; left: 30px;
    }
    .hud-health .label { color: #555; font-size: 0.65rem; letter-spacing: 0.2em; margin-bottom: 4px; }
    .hud-health .bar {
      width: 200px; height: 6px; background: #1a1a1f; border-radius: 3px; overflow: hidden;
      border: 1px solid #333;
    }
    .hud-health .fill {
      height: 100%; background: linear-gradient(90deg, #8b1a1a, #cc3333); border-radius: 3px;
      transition: width 0.3s ease;
    }

    .hud-nitro {
      position: absolute; bottom: 80px; left: 30px;
    }
    .hud-nitro .label { color: #555; font-size: 0.65rem; letter-spacing: 0.2em; margin-bottom: 4px; }
    .hud-nitro .bar {
      width: 200px; height: 6px; background: #1a1a1f; border-radius: 3px; overflow: hidden;
      border: 1px solid #333;
    }
    .hud-nitro .fill {
      height: 100%; background: linear-gradient(90deg, #2a5c8b, #4a9cd4); border-radius: 3px;
      transition: width 0.3s ease;
    }

    .hud-weapons {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    .weapon-slot {
      width: 56px; height: 56px; border: 1px solid #c9952a30;
      background: rgba(10,10,12,0.8); display: flex; align-items: center; justify-content: center;
      position: relative; backdrop-filter: blur(4px);
    }
    .weapon-slot.active { border-color: #c9952a; box-shadow: 0 0 15px rgba(201,149,42,0.3); }
    .weapon-slot img { width: 32px; height: 32px; filter: brightness(0.8); }
    .weapon-slot .ammo {
      position: absolute; bottom: 2px; right: 4px;
      font-size: 0.6rem; color: #c9952a; font-weight: 700;
    }

    .hud-minimap {
      position: absolute; top: 20px; right: 20px;
      width: 150px; height: 150px; border: 1px solid #c9952a30;
      background: rgba(10,10,12,0.7); backdrop-filter: blur(4px);
    }
    .hud-minimap canvas { width: 100%; height: 100%; }

    .hud-kills {
      position: absolute; top: 20px; left: 20px;
      color: #c9952a; font-family: 'Cinzel Decorative', serif;
    }
    .hud-kills .count { font-size: 2rem; font-weight: 900; }
    .hud-kills .label { font-size: 0.6rem; color: #666; letter-spacing: 0.2em; font-family: 'Inter', sans-serif; }

    .hud-message {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Cinzel Decorative', serif; font-size: 2rem; color: #c9952a;
      text-shadow: 0 0 30px rgba(201,149,42,0.5);
      opacity: 0; transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .hud-message.show { opacity: 1; }

    /* Pause/Death overlay */
    #gameOver {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(10,5,5,0.9);
      display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    #gameOver.active { display: flex; }
    #gameOver h2 {
      font-family: 'Cinzel Decorative', serif; font-size: 3rem;
      color: #cc3333; text-shadow: 0 0 40px rgba(200,0,0,0.5);
      letter-spacing: 0.15em;
    }
    #gameOver .stats { color: #888; margin: 20px 0 40px; font-size: 0.9rem; }
    .menu-btn:disabled { opacity: 0.35; cursor: default; transform: none !important; }

    /* Menu character info */
    #menuCharInfo { display: none; margin-bottom: 24px; text-align: center; }
    #menuCharInfo.active { display: block; }
    #menuCharInfo .char-name { color: #c9952a; font-family: 'Cinzel Decorative', serif; font-size: 1.2rem; font-weight: 700; }
    #menuCharInfo .char-detail { color: #666; font-size: 0.75rem; letter-spacing: 0.15em; margin-top: 4px; }
    #menuCharPortrait { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #c9952a40; margin: 0 auto 8px; overflow: hidden; background: #1a1a1f; }
    #menuCharPortrait img { width: 100%; height: 100%; object-fit: cover; }

    /* HUD driver frame */
    .hud-driver { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 10px; }
    .hud-driver-portrait { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #c9952a; overflow: hidden; background: #1a1a1f; flex-shrink: 0; }
    .hud-driver-portrait img { width: 100%; height: 100%; object-fit: cover; }
    .hud-driver-info .driver-name { color: #c9952a; font-family: 'Cinzel Decorative', serif; font-size: 0.85rem; font-weight: 700; }
    .hud-driver-info .driver-id { color: #444; font-size: 0.55rem; letter-spacing: 0.1em; font-family: monospace; }

    /* ── Character Creation Overlay ── */
    #characterCreation {
      position: fixed; inset: 0; z-index: 60;
      background: radial-gradient(ellipse at 50% 20%, rgba(20,14,30,0.97) 0%, rgba(10,10,12,0.99) 100%);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    #characterCreation.active { display: flex; }

    .cc-dots { display: flex; gap: 10px; margin-bottom: 24px; }
    .cc-dot { width: 10px; height: 10px; border-radius: 50%; background: #222; border: 1px solid #444; transition: all 0.3s; }
    .cc-dot.active { background: #c9952a; border-color: #c9952a; box-shadow: 0 0 8px rgba(201,149,42,0.5); }
    .cc-dot.done { background: #5a4a1a; border-color: #8b6914; }

    .cc-body { width: 100%; max-width: 640px; padding: 0 24px; text-align: center; }
    .cc-title {
      font-family: 'Cinzel Decorative', serif; font-size: 1.8rem; font-weight: 900;
      background: linear-gradient(135deg, #c9952a 0%, #f5d77a 40%, #c9952a 60%, #8b6914 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 0.1em; margin-bottom: 6px;
    }
    .cc-subtitle { color: #666; font-size: 0.8rem; letter-spacing: 0.15em; margin-bottom: 28px; }
    .cc-hint { color: #555; font-size: 0.7rem; margin-top: 8px; transition: color 0.2s; }

    .cc-input {
      width: 100%; max-width: 340px; padding: 14px 20px; font-size: 1.1rem;
      background: rgba(20,20,25,0.9); border: 1px solid #c9952a40; color: #c9952a;
      font-family: 'Cinzel Decorative', serif; text-align: center; letter-spacing: 0.08em;
      outline: none; transition: border-color 0.3s;
    }
    .cc-input:focus { border-color: #c9952a; box-shadow: 0 0 15px rgba(201,149,42,0.15); }
    .cc-input::placeholder { color: #444; }

    .cc-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
    .cc-btn { font-size: 0.9rem !important; padding: 12px 36px !important; }
    .cc-btn.cc-back { opacity: 0.7; }
    .cc-btn.cc-back:hover { opacity: 1; }
    .cc-btn.cc-primary { background: linear-gradient(135deg, rgba(201,149,42,0.3) 0%, rgba(201,149,42,0.1) 100%) !important; border-color: #c9952a !important; }
    .cc-btn.cc-sm { font-size: 0.8rem !important; padding: 10px 24px !important; }
    .cc-btn.cc-ghost { border-color: #333 !important; color: #666 !important; }

    /* Card grid */
    .cc-grid { display: grid; gap: 12px; margin-bottom: 8px; }
    .cc-grid-6 { grid-template-columns: repeat(3, 1fr); }
    .cc-grid-4 { grid-template-columns: repeat(2, 1fr); }
    .cc-card {
      padding: 16px 12px; border: 1px solid #2a2a30; background: rgba(15,15,20,0.8);
      cursor: pointer; transition: all 0.25s; text-align: center; position: relative;
    }
    .cc-card:hover { border-color: #555; background: rgba(25,25,35,0.9); }
    .cc-card.selected { border-color: var(--accent, #c9952a); box-shadow: 0 0 20px rgba(201,149,42,0.2); background: rgba(201,149,42,0.06); }
    .cc-card-icon { font-size: 1.8rem; margin-bottom: 6px; }
    .cc-card-name { color: #c9952a; font-family: 'Cinzel Decorative', serif; font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
    .cc-card-trait { color: #666; font-size: 0.65rem; letter-spacing: 0.05em; line-height: 1.4; }
    .cc-card-swatch { width: 24px; height: 4px; border-radius: 2px; margin: 8px auto 0; }

    /* Portrait step */
    .cc-portrait-frame {
      width: 200px; height: 200px; margin: 0 auto 16px; border: 2px solid #c9952a30;
      background: rgba(15,15,20,0.9); position: relative; overflow: hidden;
    }
    .cc-portrait-img { width: 100%; height: 100%; object-fit: cover; }
    .cc-portrait-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 4rem; color: #2a2a30; font-family: 'Cinzel Decorative', serif;
    }
    .cc-portrait-spinner {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; background: rgba(10,10,12,0.85);
    }
    .cc-portrait-spinner.active { display: flex; }
    .cc-portrait-spinner span { color: #c9952a; font-size: 0.7rem; margin-top: 12px; letter-spacing: 0.1em; }
    .cc-spin-ring {
      width: 32px; height: 32px; border: 3px solid #2a2a30; border-top-color: #c9952a;
      border-radius: 50%; animation: ccSpin 0.8s linear infinite;
    }
    @keyframes ccSpin { to { transform: rotate(360deg); } }
    .cc-portrait-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; }

    /* Confirm summary */
    .cc-summary { display: flex; gap: 24px; align-items: center; justify-content: center; margin-bottom: 16px; }
    .cc-summary-portrait { width: 120px; height: 120px; border: 2px solid #c9952a40; overflow: hidden; flex-shrink: 0; background: #1a1a1f; }
    .cc-summary-portrait img { width: 100%; height: 100%; object-fit: cover; }
    .cc-summary-info { text-align: left; }
    .cc-summary-name { color: #c9952a; font-family: 'Cinzel Decorative', serif; font-size: 1.4rem; font-weight: 900; margin-bottom: 10px; }
    .cc-summary-row { margin-bottom: 6px; }
    .cc-label { color: #555; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; margin-right: 8px; }
    .cc-value { color: #aaa; font-size: 0.85rem; }
    .cc-uuid { font-family: monospace; font-size: 0.65rem; color: #444; }

    /* ── Car Shop Overlay ── */
    #carShop {
      position: fixed; inset: 0; z-index: 55;
      background: radial-gradient(ellipse at 50% 20%, rgba(20,14,30,0.97) 0%, rgba(10,10,12,0.99) 100%);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; overflow-y: auto;
    }
    #carShop.active { display: flex; }

    .shop-body { width: 100%; max-width: 740px; padding: 24px; }
    .shop-header { text-align: center; margin-bottom: 28px; }
    .shop-title {
      font-family: 'Cinzel Decorative', serif; font-size: 2rem; font-weight: 900;
      background: linear-gradient(135deg, #c9952a 0%, #f5d77a 40%, #c9952a 60%, #8b6914 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 0.1em; margin-bottom: 12px;
    }
    .shop-coins {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(201,149,42,0.08); border: 1px solid #c9952a30;
      padding: 8px 20px; border-radius: 4px;
    }
    .coin-icon { font-size: 1.4rem; }
    .coin-value { color: #c9952a; font-family: 'Cinzel Decorative', serif; font-size: 1.6rem; font-weight: 900; }
    .coin-label { color: #666; font-size: 0.6rem; letter-spacing: 0.2em; }

    .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
    @media (max-width: 600px) { .shop-grid { grid-template-columns: 1fr; } }

    .shop-card {
      padding: 20px; border: 1px solid #2a2a30; background: rgba(15,15,20,0.85);
      transition: all 0.25s; position: relative;
    }
    .shop-card:hover { border-color: #444; }
    .shop-card.maxed { border-color: #c9952a40; background: rgba(201,149,42,0.04); }
    .shop-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .shop-card-icon { font-size: 1.4rem; }
    .shop-card-label { color: #c9952a; font-family: 'Cinzel Decorative', serif; font-size: 1rem; font-weight: 700; }
    .shop-card-desc { color: #666; font-size: 0.7rem; letter-spacing: 0.05em; margin-bottom: 12px; }
    .shop-card-current { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tier-name { color: #ddd; font-size: 0.85rem; font-weight: 600; }
    .tier-level { color: #555; font-size: 0.65rem; letter-spacing: 0.1em; }

    .tier-pips { display: flex; gap: 4px; margin-bottom: 12px; }
    .tier-pip {
      flex: 1; height: 4px; border-radius: 2px;
      background: #1a1a1f; border: 1px solid #333; transition: all 0.3s;
    }
    .tier-pip.filled { background: #c9952a; border-color: #c9952a; }
    .tier-pip.next { border-color: #c9952a60; background: rgba(201,149,42,0.15); }

    .shop-buy-btn {
      width: 100%; font-size: 0.75rem !important; padding: 10px 16px !important;
      text-align: center;
    }
    .shop-buy-btn.locked { opacity: 0.4; cursor: not-allowed; }
    .shop-maxed {
      text-align: center; color: #c9952a; font-family: 'Cinzel Decorative', serif;
      font-size: 0.85rem; font-weight: 700; letter-spacing: 0.2em; padding: 10px 0;
    }

    .shop-footer { text-align: center; }
    .shop-hint { color: #555; font-size: 0.7rem; letter-spacing: 0.1em; margin-bottom: 16px; }
    .shop-close-btn { font-size: 0.9rem !important; }

    /* HUD coins display */
    .hud-coins {
      position: absolute; top: 20px; right: 20px;
      display: flex; align-items: center; gap: 6px;
      background: rgba(10,10,12,0.7); border: 1px solid #c9952a30;
      padding: 6px 14px; backdrop-filter: blur(4px);
    }
    .hud-coins .coin-icon { font-size: 1rem; }
    .hud-coins .coin-val {
      color: #c9952a; font-family: 'Cinzel Decorative', serif;
      font-size: 1rem; font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loadingScreen">
    <h1>GRUDGE DRIVE</h1>
    <div class="subtitle">Vehicular Combat</div>
    <div class="bar-container"><div class="bar-fill" id="loadBar"></div></div>
    <div class="load-text" id="loadText">Initializing engine...</div>
  </div>

  <!-- Character Creation -->
  <div id="characterCreation">
    <div class="cc-dots"></div>
    <div class="cc-body"></div>
  </div>

  <!-- Main Menu -->
  <div id="mainMenu" class="hidden">
    <h1>GRUDGE DRIVE</h1>
    <div class="tagline">by Racalvin The Pirate King</div>
    <div id="menuCharInfo">
      <div id="menuCharPortrait"></div>
      <div class="char-name" id="menuCharName"></div>
      <div class="char-detail" id="menuCharDetail"></div>
    </div>
    <button class="menu-btn" id="btnPlay">Enter Arena</button>
    <button class="menu-btn" id="btnShop">Vehicle Shop</button>
    <button class="menu-btn" id="btnCreate">Create Driver</button>
    <button class="menu-btn" id="btnChange" style="display:none">Change Driver</button>
    <button class="menu-btn" id="btnControls">Controls</button>
    <div class="credit">GRUDGE STUDIO &mdash; <span>Racalvin The Pirate King</span></div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-speed">
      <div class="value" id="speedValue">0</div>
      <div class="unit">KM/H</div>
    </div>
    <div class="hud-health">
      <div class="label">HULL INTEGRITY</div>
      <div class="bar"><div class="fill" id="healthFill" style="width:100%"></div></div>
    </div>
    <div class="hud-nitro">
      <div class="label">NITRO</div>
      <div class="bar"><div class="fill" id="nitroFill" style="width:100%"></div></div>
    </div>
    <div class="hud-weapons">
      <div class="weapon-slot active" id="wSlot0">
        <img src="assets/sprites/gun.png" alt="gun" />
        <span class="ammo" id="ammo0">∞</span>
      </div>
      <div class="weapon-slot" id="wSlot1">
        <img src="assets/sprites/rocket.png" alt="rocket" />
        <span class="ammo" id="ammo1">5</span>
      </div>
      <div class="weapon-slot" id="wSlot2">
        <img src="assets/sprites/bombSprite.png" alt="bomb" />
        <span class="ammo" id="ammo2">3</span>
      </div>
    </div>
    <div class="hud-driver">
      <div class="hud-driver-portrait" id="hudPortrait"></div>
      <div class="hud-driver-info">
        <div class="driver-name" id="hudDriverName"></div>
        <div class="driver-id" id="hudDriverId"></div>
        <div style="margin-top:4px">
          <span class="count" id="killCount" style="font-size:1.4rem;font-weight:900;color:#c9952a;font-family:'Cinzel Decorative',serif">0</span>
          <span class="label" style="font-size:0.55rem;color:#666;letter-spacing:0.15em;margin-left:4px">KILLS</span>
        </div>
      </div>
    </div>
    <div class="hud-message" id="hudMessage"></div>
    <div class="hud-coins">
      <span class="coin-icon">🪙</span>
      <span class="coin-val" id="hudCoins">0</span>
    </div>
  </div>

  <!-- Car Shop -->
  <div id="carShop">
    <div class="shop-body"></div>
  </div>

  <!-- Game Over -->
  <div id="gameOver">
    <h2>WRECKED</h2>
    <div class="stats" id="goStats"></div>
    <button class="menu-btn" id="btnRestart">Fight Again</button>
    <button class="menu-btn" id="btnQuit">Main Menu</button>
  </div>

  <canvas id="renderCanvas"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
